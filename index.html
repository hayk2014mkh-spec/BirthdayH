<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hayk's Birthday Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- EmailJS գրադարան -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
     (function(){
        emailjs.init({
          publicKey: "ՁԵՐ_PUBLIC_KEY", // Այստեղ գրեք ձեր EmailJS Public Key-ն
        });
     })();
  </script>

  <style>
    :root {
      --bg-dark: #070102;
      --blood-deep: #420408;
      --blood-crimson: #800a12;
      --blood-bright: #c1121f;
      --blood-glow: rgba(193, 18, 31, 0.45);
      --glass-bg: rgba(22, 6, 8, 0.55);
      --glass-border: rgba(193, 18, 31, 0.28);
      --glass-border-hover: rgba(255, 60, 75, 0.6);
      --text-main: #f5e8e8;
      --text-muted: #a67c82;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-lights {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .light-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.5;
      animation: floatPulse 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 550px;
      height: 550px;
      top: -150px;
      left: 10%;
      background: radial-gradient(circle, var(--blood-crimson) 0%, transparent 70%);
    }

    .orb-2 {
      width: 650px;
      height: 650px;
      bottom: -150px;
      right: 5%;
      background: radial-gradient(circle, var(--blood-deep) 0%, transparent 75%);
      animation-duration: 16s;
    }

    .orb-3 {
      width: 400px;
      height: 400px;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(140, 10, 20, 0.3) 0%, transparent 70%);
      animation-duration: 9s;
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(193, 18, 31, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(193, 18, 31, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatPulse {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.4;
      }
      100% {
        transform: translateY(-40px) scale(1.15);
        opacity: 0.65;
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(193, 18, 31, 0.15);
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--blood-bright);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--blood-bright);
    }

    .spec-tag {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid rgba(193, 18, 31, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(10, 0, 0, 0.4);
    }

    .hero {
      text-align: center;
      margin-bottom: 60px;
    }

    .hero-meta {
      font-size: 0.85rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #e0434f;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      background: linear-gradient(180deg, #ffffff 30%, #f1a4a9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(193, 18, 31, 0.4);
    }

    .hero-desc {
      max-width: 620px;
      margin: 0 auto;
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 300;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blood-bright), transparent);
      opacity: 0.5;
    }

    .glass-card:hover {
      border-color: var(--glass-border-hover);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(193, 18, 31, 0.25);
    }

    .timer-section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .target-date {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .time-slot {
      background: rgba(10, 2, 3, 0.6);
      border: 1px solid rgba(193, 18, 31, 0.2);
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .time-slot:hover {
      transform: translateY(-3px);
      border-color: var(--blood-bright);
    }

    .time-value {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 700;
      color: #fff;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 20px var(--blood-glow);
    }

    .time-label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .rsvp-section {
      margin-bottom: 40px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: #e5b3b7;
    }

    .text-input {
      width: 100%;
      background: rgba(8, 1, 2, 0.7);
      border: 1px solid rgba(193, 18, 31, 0.35);
      border-radius: 12px;
      padding: 16px 20px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .text-input:focus {
      border-color: var(--blood-bright);
      box-shadow: 0 0 20px rgba(193, 18, 31, 0.3);
      background: rgba(18, 2, 4, 0.85);
    }

    .text-input::placeholder {
      color: #6d4b50;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .custom-radio {
      position: relative;
    }

    .custom-radio input[type="radio"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .radio-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      background: rgba(10, 2, 3, 0.6);
      border: 1px solid rgba(193, 18, 31, 0.25);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      color: var(--text-muted);
    }

    .radio-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid rgba(193, 18, 31, 0.6);
      transition: all 0.3s ease;
    }

    .custom-radio input[type="radio"]:checked + .radio-card {
      border-color: var(--blood-bright);
      background: rgba(193, 18, 31, 0.15);
      color: #fff;
      box-shadow: 0 0 20px rgba(193, 18, 31, 0.25);
    }

    .custom-radio input[type="radio"]:checked + .radio-card .radio-dot {
      background: var(--blood-bright);
      border-color: #ff4d5a;
      box-shadow: 0 0 10px var(--blood-bright);
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 18px 24px;
      background: linear-gradient(135deg, var(--blood-crimson) 0%, var(--blood-bright) 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(193, 18, 31, 0.35);
    }

    .submit-btn:hover {
      box-shadow: 0 12px 35px rgba(220, 20, 40, 0.55);
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .status-message {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.95rem;
      border: 1px solid transparent;
    }

    .status-success {
      display: block;
      background: rgba(30, 8, 10, 0.8);
      border-color: var(--blood-bright);
      color: #ffb3b8;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #633f44;
      margin-top: 40px;
    }

    @media (max-width: 640px) {
      .container {
        padding: 24px 16px 60px;
      }
      .timer-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="bg-lights">
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>
  </div>
  <div class="grid-lines"></div>

  <div class="container">
    <header>
      <div class="brand-logo">HAYK</div>
      <div class="spec-tag">Specimen // 02.11</div>
    </header>

    <section class="hero">
      <div class="hero-meta">Exclusive Invitation</div>
      <h1 class="hero-title">Hayk's Birthday</h1>
      <p class="hero-desc">
        Հրավիրում եմ քեզ միասին նշելու իմ ծննդյան օրը: Միացիր ինձ այս առանձնահատուկ երեկոյին:
      </p>
    </section>

    <section class="glass-card timer-section">
      <div class="section-header">
        <span class="section-label">Countdown</span>
        <span class="target-date">November 2</span>
      </div>
      <div class="timer-grid">
        <div class="time-slot">
          <div class="time-value" id="days">00</div>
          <div class="time-label">Օր</div>
        </div>
        <div class="time-slot">
          <div class="time-value" id="hours">00</div>
          <div class="time-label">Ժամ</div>
        </div>
        <div class="time-slot">
          <div class="time-value" id="minutes">00</div>
          <div class="time-label">Րոպե</div>
        </div>
        <div class="time-slot">
          <div class="time-value" id="seconds">00</div>
          <div class="time-label">Վայրկյան</div>
        </div>
      </div>
    </section>

    <section class="glass-card rsvp-section">
      <div class="section-header">
        <span class="section-label">RSVP Confirmation</span>
        <span class="target-date">Attendance</span>
      </div>

      <form id="rsvpForm">
        <div class="form-group">
          <label class="form-label" for="guestName">Քո Անունը</label>
          <input 
            type="text" 
            id="guestName" 
            class="text-input" 
            placeholder="Գրիր անունդ այստեղ..." 
            required 
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Կկարողանա՞ս մասնակցել</label>
          <div class="options-grid">
            <label class="custom-radio">
              <input type="radio" name="attendance" value="Անպայման կգամ" checked />
              <div class="radio-card">
                <span class="radio-dot"></span>
                <span>Անպայման կգամ</span>
              </div>
            </label>

            <label class="custom-radio">
              <input type="radio" name="attendance" value="Ցավոք, չեմ կարող" />
              <div class="radio-card">
                <span class="radio-dot"></span>
                <span>Ցավոք, չեմ կարող</span>
              </div>
            </label>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Հաստատել Պատասխանը
        </button>
      </form>

      <div id="statusMsg" class="status-message"></div>
    </section>

    <footer>
      Hayk // All Rights Reserved © 2026
    </footer>
  </div>

  <script>
    // Թայմեր դեպի Նոյեմբերի 2
    function getNextTargetDate() {
      const now = new Date();
      let year = now.getFullYear();
      let target = new Date(year, 10, 2, 0, 0, 0);

      if (now > target) {
        target = new Date(year + 1, 10, 2, 0, 0, 0);
      }
      return target;
    }

    const targetDate = getNextTargetDate();

    function updateTimer() {
      const now = new Date().getTime();
      const difference = targetDate.getTime() - now;

      if (difference <= 0) {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, "0");
      document.getElementById("hours").innerText = String(hours).padStart(2, "0");
      document.getElementById("minutes").innerText = String(minutes).padStart(2, "0");
      document.getElementById("seconds").innerText = String(seconds).padStart(2, "0");
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    // Ֆորմայի ուղարկումը EmailJS-ի միջոցով դեպի hayk2014mkh@gmail.com
    document.getElementById("rsvpForm").addEventListener("submit", function (e) {
      e.preventDefault();
      
      const name = document.getElementById("guestName").value.trim();
      const attendance = document.querySelector('input[name="attendance"]:
