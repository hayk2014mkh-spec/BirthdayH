<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Հայկի ծնունդը</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800&family=Noto+Serif+Armenian:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --beige:#0e0203; --beige-light:#180406; --sand:#800a12;
  --black:#ffffff; --ink:#f5e8e8;
  --coral:#c1121f; --sun:#ff3c4b; --mint:#4fd1a5; --sky:#5cb8ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Noto Sans Armenian","Sylfaen","Segoe UI",Arial,sans-serif;
  background:var(--beige);color:var(--ink);line-height:1.55;min-height:100vh;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(193,18,31,.12) 1px,transparent 1.2px);background-size:18px 18px;
}
main{position:relative;max-width:780px;margin:0 auto;padding:48px 20px 72px}

/* Hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:36px}
.hero .lead{font-weight:600;margin-bottom:6px;color:#d88c93;}
.names h1{font-family:"Noto Serif Armenian","Sylfaen",Georgia,serif;font-weight:900;line-height:1;letter-spacing:-.01em;font-size:clamp(3.2rem,15vw,6.4rem)}
.names .hayk{color:var(--coral);text-shadow:3px 3px 0 #420408}
.hero .extra{margin-top:10px;font-weight:600}
.hero .extra:empty{display:none}
.badge{
  width:clamp(110px,26vw,150px);aspect-ratio:1;border-radius:50%;background:var(--coral);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:#ffffff;transform:rotate(8deg);box-shadow:0 0 0 6px var(--beige),0 0 0 9px var(--coral);
}
.badge b{font-family:"Noto Serif Armenian",Georgia,serif;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1}
.badge span{font-weight:800;font-size:clamp(.9rem,3vw,1.1rem)}

/* Countdown */
.count-wrap{background:#1a0507;color:#fff;border:2px solid rgba(193,18,31,0.4);border-radius:26px;padding:22px 16px 20px;margin-bottom:36px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
.count-title{font-weight:600;margin-bottom:10px;opacity:.9;color:#e5b3b7;}
.count{display:grid;grid-template-columns:repeat(4,1fr)}
.cell{padding:2px 4px}
.cell + .cell{border-left:2px dotted rgba(193,18,31,.35)}
.cell b{display:block;font-family:"Noto Serif Armenian",Georgia,serif;font-size:clamp(2.2rem,10vw,3.8rem);line-height:1.1;font-variant-numeric:tabular-nums}
.cell:nth-child(1) b{color:var(--sun)}
.cell:nth-child(2) b{color:#ff7582}
.cell:nth-child(3) b{color:var(--coral)}
.cell:nth-child(4) b{color:#ffb3b8}
.cell span{font-size:.9rem;color:#a67c82}
.today{display:none;font-family:"Noto Serif Armenian",Georgia,serif;font-size:clamp(1.6rem,6vw,2.6rem);color:var(--sun)}

/* Form */
.card{background:var(--beige-light);border:3px solid var(--coral);border-radius:26px;padding:30px 26px;box-shadow:8px 8px 0 #420408}
.card h2{font-family:"Noto Serif Armenian",Georgia,serif;font-size:1.7rem;margin-bottom:4px;color:#fff}
.card .sub{opacity:.8;margin-bottom:22px;color:#a67c82}
.field{display:block;font-weight:600;margin-bottom:8px;color:#f5e8e8}
input[type=text],textarea{width:100%;font:inherit;font-size:1.05rem;padding:13px 15px;color:#fff;background:#0e0203;border:2px solid rgba(193,18,31,0.5);border-radius:14px;margin-bottom:20px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
fieldset{border:0;margin-bottom:20px}
legend{font-weight:600;margin-bottom:8px;color:#f5e8e8}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:block;text-align:center;font-weight:800;padding:14px 8px;cursor:pointer;background:#0e0203;color:#f5e8e8;border:2px solid rgba(193,18,31,0.5);border-radius:14px;transition:background .15s,color .15s}
.choice input[value="yes"]:checked + span{background:var(--coral);color:#fff;border-color:var(--coral)}
.choice input[value="no"]:checked + span{background:#2a080c;color:#ffb3b8;border-color:var(--coral)}
.choice input:focus-visible + span{outline:4px solid var(--sun);outline-offset:2px}

#guestsBox{margin-bottom:20px}
.stepper{display:inline-flex;align-items:center;border:2px solid rgba(193,18,31,0.5);border-radius:14px;background:#0e0203;overflow:hidden}
.stepper button{width:52px;height:50px;font:inherit;font-size:1.6rem;font-weight:800;background:var(--coral);color:#fff;border:0;cursor:pointer}
.stepper button:focus-visible{outline:4px solid var(--sun);outline-offset:-4px}
.stepper output{min-width:64px;text-align:center;font-size:1.4rem;font-weight:800;color:#fff}
.hint{font-size:.9rem;opacity:.7;margin-top:6px;color:#a67c82}

button.send{width:100%;font:inherit;font-size:1.1rem;font-weight:800;padding:16px;cursor:pointer;background:var(--coral);color:#fff;border:3px solid #ff3c4b;border-radius:16px;box-shadow:0 5px 0 #420408}
button.send:active{transform:translateY(4px);box-shadow:0 1px 0 #420408}
button.send:disabled{opacity:.6;cursor:wait}
button.send:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.msg{display:none;margin-top:16px;font-weight:600;border-radius:14px;padding:12px 14px}
.msg.ok{display:block;background:rgba(30,8,10,0.9);color:#ffb3b8;border:1px solid var(--coral)}
.msg.err{display:block;background:rgba(42,8,12,0.9);color:#ff7582;border:1px solid var(--coral)}
footer{text-align:center;margin-top:34px;font-weight:600;color:#a67c82}
@media (max-width:480px){.hero{grid-template-columns:1fr}.badge{justify-self:start;order:-1;width:100px}.card{padding:24px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="names">
      <p class="lead">Հրավիրում եմ իմ ծննդյան տոնին</p>
      <h1 class="hayk">Հայկ</h1>
      <div class="extra" id="extra"></div>
    </div>
    <div class="badge" aria-label="Նոյեմբերի 2"><b>2</b><span>նոյեմբերի</span></div>
  </section>

  <section class="count-wrap" aria-live="polite">
    <div class="count-title" id="countTitle">Ծննդյանս մնաց</div>
    <div class="count" id="count">
      <div class="cell"><b id="d">0</b><span>օր</span></div>
      <div class="cell"><b id="h">0</b><span>ժամ</span></div>
      <div class="cell"><b id="m">0</b><span>րոպե</span></div>
      <div class="cell"><b id="s">0</b><span>վայրկյան</span></div>
    </div>
    <div class="today" id="today">Այսօր իմ ծունդն է! 🎉</div>
  </section>

  <section class="card">
    <h2>Կգա՞ք իմ ծնունդին</h2>
    <p class="sub">Գրեք ձեր անունը, ընտրեք պատասխանը և, եթե ուզում եք, թողեք մի բարի խոսք։</p>
    <form id="rsvp" novalidate>
      <label class="field" for="name">Ձեր անունը</label>
      <input type="text" id="name" name="name" autocomplete="name" maxlength="60" placeholder="Օրինակ՝ Արամ">

      <fieldset>
        <legend>Գալո՞ւ եք</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="status" value="yes"><span>Այո, գալիս ենք</span></label>
          <label class="choice"><input type="radio" name="status" value="no"><span>Ոչ, չենք գալիս</span></label>
        </div>
      </fieldset>

      <div id="guestsBox" hidden>
        <span class="field" id="guestsLabel">Քանի հոգի կգաք ձեր ընտանիքից</span>
        <div class="stepper" role="group" aria-labelledby="guestsLabel">
          <button type="button" id="minus" aria-label="Պակասեցնել">−</button>
          <output id="guests" aria-live="polite">1</output>
          <button type="button" id="plus" aria-label="Ավելացնել">+</button>
        </div>
        <p class="hint">Հաշվեք նաև ձեզ։</p>
      </div>

      <label class="field" for="note">Մի քանի խոսք Հայկի համար</label>
      <textarea id="note" name="note" maxlength="500" placeholder="Գրեք ձեր մաղթանքը կամ հարցը..."></textarea>

      <button class="send" type="submit" id="btn">Ուղարկել պատասխանը</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </section>

  <footer>Սպասում եմ ձեզ։ Հայկ</footer>
</main>

<script>
const CONFIG = {
  email: "hayk2014mkh@gmail.com",
  month: 11, day: 2,        // ծննդյան օրը՝ նոյեմբերի 2
  time: "",                // օրինակ՝ "16:00"
  place: ""                // օրինակ՝ "Երևան, Աբովյան 10"
};
const el = id => document.getElementById(id);

el("extra").textContent = [
  CONFIG.time && "Ժամը՝ " + CONFIG.time,
  CONFIG.place && "Վայրը՝ " + CONFIG.place
].filter(Boolean).join(" · ");

function targetDate(){
  const now = new Date();
  let t = new Date(now.getFullYear(), CONFIG.month-1, CONFIG.day, 0,0,0);
  if (now >= new Date(t.getTime() + 864e5)) t = new Date(now.getFullYear()+1, CONFIG.month-1, CONFIG.day, 0,0,0);
  return t;
}
function tick(){
  const diff = targetDate() - new Date();
  if (diff <= 0){
    el("count").style.display = "none";
    el("countTitle").style.display = "none";
    el("today").style.display = "block";
    return;
  }
  const s = Math.floor(diff/1000);
  el("d").textContent = Math.floor(s/86400);
  el("h").textContent = Math.floor(s%86400/3600);
  el("m").textContent = Math.floor(s%3600/60);
  el("s").textContent = s%60;
}
tick(); setInterval(tick, 1000);

let guests = 1;
const setGuests = n => { guests = Math.min(15, Math.max(1, n)); el("guests").textContent = guests; };
el("plus").onclick  = () => setGuests(guests+1);
el("minus").onclick = () => setGuests(guests-1);

const form = el("rsvp"), msg = el("msg"), btn = el("btn");
form.querySelectorAll('input[name="status"]').forEach(r =>
  r.addEventListener("change", () => { el("guestsBox").hidden = form.status.value !== "yes"; })
);

const show = (type, html) => { msg.className = "msg " + type; msg.innerHTML = html; };
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

form.addEventListener("submit", async e => {
  e.preventDefault();
  const name = form.name.value.trim(), status = form.status.value, note = form.note.value.trim();
  if (!name){ show("err","Խնդրում ենք գրեք ձեր անունը։"); form.name.focus(); return; }
  if (!status){ show("err","Խնդրում ենք ընտրեք՝ գալիս եք, թե ոչ։"); return; }

  const answer = status === "yes" ? "ԳԱԼԻՍ Է" : "ՉԻ ԳԱԼԻՍ";
  const count  = status === "yes" ? String(guests) : "0";
  btn.disabled = true; btn.textContent = "Ուղարկվում է...";
  try{
    const res = await fetch("https://formsubmit.co/ajax/" + CONFIG.email, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({
        _subject: "Հայկի ծնունդ՝ " + name + " — " + answer + (status==="yes" ? " (" + count + " հոգի)" : ""),
        _template: "table",
        "Անուն": name,
        "Պատասխան": answer,
        "Քանի հոգի": count,
        "Մաղթանք / նշում": note || "—"
      })
    });
    if (!res.ok) throw new Error("bad status");
    show("ok", status === "yes"
      ? "Շնորհակալություն, " + esc(name) + "։ Սպասում եմ ձեզ։"
      : "Շնորհակալություն, " + esc(name) + "։ Կափսոսում եմ, որ չեք գա։");
    form.reset(); setGuests(1); el("guestsBox").hidden = true;
  }catch(err){
    const body = encodeURIComponent("Անուն՝ " + name + "\nՊատասխան՝ " + answer + "\nՔանի հոգի՝ " + count + "\nՆշում՝ " + note);
    const subj = encodeURIComponent("Հայկի ծնունդ՝ " + name + " — " + answer);
    show("err", "Չհաջողվեց ուղարկել։ Կարող եք ուղարկել էլ. փոստով՝ <a href=\"mailto:" + CONFIG.email + "?subject=" + subj + "&body=" + body + "\">սեղմեք այստեղ</a>։");
  }finally{
    btn.disabled = false; btn.textContent = "Ուղարկել պատասխանը";
  }
});
</script>
</body>
</html>
